<text x="18.00" y="200.32" fill="#d5dae3" xml:space="preserve">  Runs in every new terminal. Installers add PATH exports, `eval &quot;$(tool init)&quot;` hooks and completions here </text><text x="928.44" y="200.32" fill="#d5dae3" textLength="8.43" lengthAdjust="spacingAndGlyphs" xml:space="preserve">—</text><text x="936.87" y="200.32" fill="#d5dae3" xml:space="preserve"> each line execut</text>
<text x="18.00" y="218.32" fill="#d5dae3" xml:space="preserve">es with your permissions.</text>
<text x="18.00" y="236.32" fill="#d5dae3" xml:space="preserve">  line: defines an alias: alias ll='ls -lh'</text>
<text x="18.00" y="254.32" fill="#d5dae3" xml:space="preserve">  line: sets an environment variable: export EDITOR=vim</text>
<text x="18.00" y="272.32" fill="#d5dae3" xml:space="preserve">  line: changes PATH: export PATH=&quot;$HOME/.acme/bin:$PATH&quot;</text>
<text x="18.00" y="290.32" fill="#d5dae3" xml:space="preserve">  line: evaluates generated code on every shell start: eval &quot;$(acme shell-init zsh)&quot;</text>
