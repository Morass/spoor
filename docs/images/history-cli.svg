<text x="18.00" y="254.32" fill="#d5dae3" xml:space="preserve">  line: defines an alias: alias ll='ls -lh'</text>
<text x="18.00" y="272.32" fill="#d5dae3" xml:space="preserve">  line: sets an environment variable: export EDITOR=vim</text>
