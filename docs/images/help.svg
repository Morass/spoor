<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="610" viewBox="0 0 1098 610" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14">
<rect width="1098" height="610" rx="10" fill="#10141b"/>
<rect width="1098" height="34" rx="10" fill="#1a1f29"/><rect y="24" width="1098" height="10" fill="#1a1f29"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="549" y="22" fill="#8b93a3" text-anchor="middle" font-size="13">spoor help</text>
<text x="18.00" y="56.32" fill="#d5dae3" xml:space="preserve">Undo a commit, whole or in part. Shows the plan unless --apply.</text>

<text x="18.00" y="92.32" fill="#d5dae3" xml:space="preserve">  spoor revert REF [--apply] [--only CATEGORIES] [--path PATH]... [--force] [--script FILE]</text>

<text x="18.00" y="128.32" fill="#d5dae3" xml:space="preserve">The plan is checked against the live machine: paths edited since the commit</text>
<text x="18.00" y="146.32" fill="#d5dae3" xml:space="preserve">are conflicts (left alone without --force), launch agents are unloaded before</text>
<text x="18.00" y="164.32" fill="#d5dae3" xml:space="preserve">their plists are removed, folders the commit created are removed as a tree</text>
<text x="18.00" y="182.32" fill="#d5dae3" xml:space="preserve">unless something inside changed later, and content that was never captured is</text>
<text x="18.00" y="200.32" fill="#d5dae3" xml:space="preserve">reported as unrestorable. Every applied revert is itself a commit.</text>

<text x="18.00" y="236.32" fill="#d5dae3" xml:space="preserve">Categories: persistence, trust, shell, path, apps, config, state, data, noise.</text>

<text x="18.00" y="272.32" fill="#d5dae3" xml:space="preserve">Examples:</text>
<text x="18.00" y="290.32" fill="#d5dae3" xml:space="preserve">  spoor revert HEAD                              # the plan</text>
<text x="18.00" y="308.32" fill="#d5dae3" xml:space="preserve">  spoor revert HEAD --apply</text>
<text x="18.00" y="326.32" fill="#d5dae3" xml:space="preserve">  spoor revert 3f1a --only persistence --apply   # just what starts by itself</text>
<text x="18.00" y="344.32" fill="#d5dae3" xml:space="preserve">  spoor revert HEAD --script undo.sh             # a reviewable shell script</text>

<text x="18.00" y="380.32" fill="#d5dae3" xml:space="preserve">Flags:</text>
<text x="18.00" y="398.32" fill="#d5dae3" xml:space="preserve">  -apply</text>
<text x="18.00" y="416.32" fill="#d5dae3" xml:space="preserve">        execute the plan (default: show it)</text>
<text x="18.00" y="434.32" fill="#d5dae3" xml:space="preserve">  -force</text>
<text x="18.00" y="452.32" fill="#d5dae3" xml:space="preserve">        overwrite paths changed since the commit</text>
<text x="18.00" y="470.32" fill="#d5dae3" xml:space="preserve">  -only string</text>
<text x="18.00" y="488.32" fill="#d5dae3" xml:space="preserve">        comma-separated categories: persistence,trust,shell,path,apps,config,state,data,noise</text>
<text x="18.00" y="506.32" fill="#d5dae3" xml:space="preserve">  -path value</text>
<text x="18.00" y="524.32" fill="#d5dae3" xml:space="preserve">        limit to PATH (repeatable)</text>
<text x="18.00" y="542.32" fill="#d5dae3" xml:space="preserve">  -script string</text>
<text x="18.00" y="560.32" fill="#d5dae3" xml:space="preserve">        write the plan as a shell script to FILE</text>
<text x="18.00" y="578.32" fill="#a6e3a1" font-weight="700" xml:space="preserve">$</text>
</svg>
